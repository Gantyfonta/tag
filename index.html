  if(M==2||M==7)tx(String(Math.floor(p.score)),x+30,y,14,'#fff','#000',5,'left')});
 if(S=='game'&&M==0&&!it&&pending>0)tx('BOOM!',500,270,40,'#ffd23c','#000',10);
 if(S=='game'&&fr%100000>=0&&fade>0)tx(['PASS THE BOMB!','DON\'T BE IT!','GRAB THE CROWN!','DON\'T GET INFECTED!','STAY UNFROZEN!','TAG THE OTHER TEAM!','CHAOS TAG!','HOLD THE HILL!'][chaos?6:M],500,270,26,'#fff','#000',8);
 ctx.restore();
 if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade/30+')';ctx.fillRect(0,0,W,H);fade-=.35}}
function loop(){
 fr++;
 if(warn>0)warn--;
 if(S=='menu')drawMenu();else if(S=='opts')drawOpts();else if(S=='edit')drawEdit();
 else{if(S=='game')step();else tick();
  if(S=='game')tick();
  drawGame();
  if(S=='over'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
   tx(msg,500,240+Math.sin(fr/10)*6,44,winner?winner.d.c:'#fff','#000',12);
   if(winner) tx('TOTAL WINS: '+winner.d.wins,500,285,18,'#ffd23c','#000',6);
   tx('ENTER / CLICK FOR MENU',500,320,16,'#fff','#000',6)}}
 requestAnimationFrame(loop)}
loadCus();loop();
</script></body></html>
